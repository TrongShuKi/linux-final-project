# /etc/ssh/sshd_config.d/99-hardening.conf
# Mẫu của repo. Cài bằng scripts/harden-ssh.sh (thay __ALLOW_USERS__ bằng danh sách user).
# Cổng 22 dùng hằng ngày; cổng 2222 là dự phòng. Cả hai dùng chung các thiết lập bên dưới.
Port 22
Port 2222
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
AllowUsers __ALLOW_USERS__
MaxAuthTries 3
LoginGraceTime 30
